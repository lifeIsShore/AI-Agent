policies:
  - action: gmail.read
    permission_level: READ_ONLY
    risk_level: LOW
    approval_required: false
    allowed_principals: ["USER", "AGENT", "SCHEDULER"]

  - action: gmail.archive
    permission_level: MODIFY
    risk_level: MEDIUM
    approval_required: true
    allowed_principals: ["USER", "AGENT"]
    prohibited_targets: ["financial_notice", "legal_notice"]

  - action: gmail.trash
    permission_level: MODIFY
    risk_level: HIGH
    approval_required: true
    allowed_principals: ["USER"]
    prohibited_targets: ["financial_notice", "bank_statement"]

  - action: gmail.send
    permission_level: MODIFY
    risk_level: HIGH
    approval_required: true
    allowed_principals: ["USER"]
